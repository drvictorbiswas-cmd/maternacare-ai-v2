services:
  - type: web
    name: maternacare-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://maternacare-ai.onrender.com"
      - key: RAZORPAY_KEY_ID
        value: ""
      - key: RAZORPAY_KEY_SECRET
        value: ""
      - key: RAZORPAY_WEBHOOK_SECRET
        value: ""
      - key: DATABASE_PATH
        value: /app/data/maternacare.db
    # NOTE: persistent disks are not available on the free plan. Data will be
    # ephemeral until you upgrade and attach a disk (or use managed Postgres).
